name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript (Node + Sys MCP) ───────────────────────────────────────────
  node:
    name: Node.js MCP Servers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            mcp-servers/node/package-lock.json
            mcp-servers/sys/package-lock.json
            mcp-servers/infra/package-lock.json
            packages/cli/package-lock.json
      - run: cd mcp-servers/node && npm ci --no-audit --no-fund
      - run: cd mcp-servers/sys  && npm ci --no-audit --no-fund
      - run: cd mcp-servers/infra && npm ci --no-audit --no-fund
      - run: cd packages/cli && npm ci --no-audit --no-fund
      - run: cd mcp-servers/node && npx tsc --noEmit
      - run: cd mcp-servers/sys  && npx tsc --noEmit
      - run: cd mcp-servers/infra && npx tsc --noEmit
      - run: cd packages/cli && npx tsc --noEmit
      - run: cd mcp-servers/node && npm test
      - run: cd mcp-servers/sys  && npm test
      - run: cd mcp-servers/infra && npm test
      - run: cd packages/cli && npm test

  # ── Go MCP Server ─────────────────────────────────────────────────────────
  go:
    name: Go MCP Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: cd mcp-servers/go && go mod download
      - run: cd mcp-servers/go && go vet ./...
      - run: cd mcp-servers/go && go test ./... -race -count=1

  # ── Python MCP Server ─────────────────────────────────────────────────────
  python:
    name: Python MCP Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: cd mcp-servers/python && pip install --quiet -e ".[dev]"
      - run: cd mcp-servers/python && ruff check .
      - run: cd mcp-servers/python && python -m pytest -v

  # ── .NET MCP Server ───────────────────────────────────────────────────────
  dotnet:
    name: .NET MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cd mcp-servers/dotnet && dotnet restore
      - run: cd mcp-servers/dotnet && dotnet build -c Release --no-restore
      - run: cd mcp-servers/dotnet && dotnet test --no-build --logger "console;verbosity=normal"

  # ── JVM MCP Server ────────────────────────────────────────────────────────
  jvm:
    name: JVM MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - run: cd mcp-servers/jvm && ./gradlew build --no-daemon

  # ── Docker Build Validation ───────────────────────────────────────────────
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [node, go, python, dotnet, jvm]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build --parallel
