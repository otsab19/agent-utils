name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write  # OIDC provenance

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-version: ${{ steps.release.outputs.new-release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install --no-audit --no-fund semantic-release @semantic-release/git @semantic-release/changelog
      - id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - run: cd mcp-servers/node && npm ci --no-audit --no-fund && npm run build
      - run: cd mcp-servers/sys  && npm ci --no-audit --no-fund && npm run build
      - run: cd mcp-servers/node && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: cd mcp-servers/sys && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-utils-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: cd mcp-servers/python && poetry build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-servers/python/dist/

  publish-go:
    name: Tag Go Module
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag go module version
        run: |
          TAG="mcp-servers/go/v${{ needs.semantic-release.outputs.new-release-version }}"
          git tag $TAG
          git push origin $TAG

  publish-nuget:
    name: Publish to NuGet
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cd mcp-servers/dotnet && dotnet pack -c Release -o ./nupkg
      - run: cd mcp-servers/dotnet && dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  publish-docker:
    name: Publish Docker Images to GHCR
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Build and push sandbox image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agent-utils-sandbox:latest,ghcr.io/${{ github.repository_owner }}/agent-utils-sandbox:${{ needs.semantic-release.outputs.new-release-version }}
          sbom: true
          provenance: true
      - name: Sign image with Cosign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/agent-utils-sandbox@${{ steps.build.outputs.digest }}
